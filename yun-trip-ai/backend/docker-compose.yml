# =============================================================================
# 云途 AI 行程规划 - Docker Compose 编排文件
# =============================================================================
# 包含以下服务：
#   1. redis      - 缓存服务（Redis 7）
#   2. backend    - FastAPI 后端服务
#
# 启动命令：docker compose up -d
# 停止命令：docker compose down
# 查看日志：docker compose logs -f
# =============================================================================

version: "3.9"

services:
  # -------------------- Redis 缓存服务 --------------------
  redis:
    image: redis:7-alpine
    container_name: yun-trip-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Redis 数据持久化
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yun-trip-ai-net
    # Redis 配置：开启 AOF 持久化，防止数据丢失
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  # -------------------- FastAPI 后端服务 --------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yun-trip-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # 从 .env 文件加载环境变量
      - .env
    environment:
      # 容器内覆盖部分配置
      - REDIS_URL=redis://redis:6379/0
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
    volumes:
      # 持久化数据目录（SQLite 数据库、Chroma 向量库、日志文件）
      - backend_data:/app/db
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - yun-trip-ai-net

# -------------------- 命名数据卷 --------------------
volumes:
  redis_data:
    name: yun-trip-ai-redis-data
  backend_data:
    name: yun-trip-ai-backend-data
  backend_logs:
    name: yun-trip-ai-backend-logs

# -------------------- 自定义网络 --------------------
networks:
  yun-trip-ai-net:
    name: yun-trip-ai-net
    driver: bridge